<section class="workspace-page script-page" aria-labelledby="script-title">
  <header class="page-heading">
    <div><p class="eyebrow">Words for the day</p><h1 id="script-title">主持词</h1></div>
    <p class="script-summary">Markdown · 实时预览</p>
  </header>
  <div class="workspace-status" aria-live="polite"><p id="script-connection">正在连接共享主持词…</p><button class="text-button" id="script-retry" type="button" hidden>重新连接</button></div>
  <section class="data-card script-card" aria-labelledby="script-editor-title">
    <div class="script-toolbar"><h2 id="script-editor-title">编辑主持词</h2><span id="script-save-state" class="script-save-state" role="status" aria-live="polite"></span></div>
    <div class="script-editor-grid">
      <div class="script-pane"><label for="host-script-editor">Markdown 编辑区</label><textarea id="host-script-editor" rows="10" spellcheck="true" placeholder="在这里写下主持词……"></textarea></div>
      <div class="script-pane script-preview-pane"><span class="script-pane-label">实时预览</span><article id="host-script-preview" class="markdown-body" aria-live="polite"><p class="script-empty-preview">在左侧编辑后，这里会显示主持词预览。</p></article></div>
    </div>
  </section>
  <p id="script-feedback" class="workspace-feedback" role="status" aria-live="polite"></p>
</section>
